name: build-all

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Gradle wrapper
        working-directory: classroom/android
        run: gradle wrapper --gradle-version 8.7
      - name: Build APK
        working-directory: classroom/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: teacher-apk
          path: classroom/android/app/build/outputs/apk/debug/*.apk

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deps
        run: pip install pyinstaller flask flask-socketio "python-socketio[client]" mss pillow pyautogui
      - name: Build server exe
        working-directory: classroom
        run: pyinstaller --clean -y server.spec
      - name: Build student exe
        working-directory: classroom
        run: pyinstaller --clean -y student.spec
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-windows-exe
          path: classroom/dist/*.exe

  release:
    needs: [apk, exe]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download apk
        uses: actions/download-artifact@v4
        with:
          name: teacher-apk
          path: dist
        continue-on-error: true
      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: classroom-windows-exe
          path: dist
        continue-on-error: true
      - name: List files
        run: ls -la dist || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
